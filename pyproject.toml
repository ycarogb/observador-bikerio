[project]
name = "observador-bikerio"
version = "0.1.0"
description = "Coleta contínua da disponibilidade das estações do Bike Rio e exportação para SIG-T."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "streamlit>=1.39",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
observador-bikerio = "observador_bikerio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observador_bikerio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
